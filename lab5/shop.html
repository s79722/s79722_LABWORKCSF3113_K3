<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Bookstore</title>
    <!-- Two Google Fonts (Roboto & Merriweather) loaded in a single link tag -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shop.css">
    <style>
        h1 { text-align: center; }
    </style>
</head>
<body>
<!--
    Error 1 (shop.html, Line 6): Google Fonts URL used '/css?' with CSS2 syntax ('wght@400;700'), should be '/css2?'.
    Error 2 (shop.html, Line 7): Incorrect rel attribute value 'stylesheets', should be 'stylesheet'.
    Error 3 (shop.html, Line 10): <style> tag placed inside <body> instead of <head>.
    Error 4 (shop.html, Line 18): Invalid inline CSS syntax 'color=#1B4F72;', should use a colon 'color: #1B4F72;'.
    Error 5 (shop.html, Line 20): Table id is 'product', which does not match '#products' in shop.css.
    Error 6 (shop.css, Line 2): Misspelled font name 'Robotto', should be 'Roboto'.
    Error 7 (shop.css, Line 4): Missing hyphen in 'no repeat', should be 'no-repeat'.
    Error 8 (shop.css, Line 5): Misspelled property 'bacground-position', should be 'background-position'.
    Error 9 (shop.css, Line 18): 'display: inline;' prevents vertical padding from working properly on nav links, should be 'display: block;'.
    Error 10 (shop.css, Line 23): Invalid pseudo-class syntax 'li:a:hover', should be 'li a:hover'.
    Error 11 (shop.css, Line 27): Invalid value 'collapsed' for border-collapse, should be 'collapse'.
    Error 12 (shop.css, Line 34): ':nth-child(2)' only styles the 2nd row instead of all alternating even rows, should be ':nth-child(even)'.
    Error 13 (shop.css, Line 37): Invalid pseudo-class ':hovered', should be ':hover'.
    Error 14 (shop.css, Line 45): Missing semicolon ';' after 'background-color: #f1f1f1'.
-->

    <!-- Semantic Header with Title -->
    <header>
        <h1>Campus Bookstore</h1>
    </header>

    <!-- Semantic Horizontal Navigation Bar -->
    <nav>
        <ul>
            <li><a class="active" href="#home">Home</a></li>
            <li><a href="#books">Books</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Semantic Main Content -->
    <main>
        <p>Textbooks, stationery and more for every student.</p>

        <table id="products">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th class="price">Price (RM)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Web Design Basics</td>
                    <td>Textbook</td>
                    <td class="price">45.00</td>
                </tr>
                <tr>
                    <td>A4 Notebook</td>
                    <td>Stationery</td>
                    <td class="price">6.50</td>
                </tr>
                <tr>
                    <td>USB Drive 32GB</td>
                    <td>Gadget</td>
                    <td class="price">25.00</td>
                </tr>
                <tr>
                    <td>Highlighter Set</td>
                    <td>Stationery</td>
                    <td class="price">9.90</td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- Semantic Footer -->
    <footer>
        <p>&copy; 2026 Campus Bookstore</p>
    </footer>

</body>
</html>
